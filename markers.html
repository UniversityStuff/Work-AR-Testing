<!doctype html>
<html lang="en" data-needs-app>
<head>
<meta charset="utf-8">
<script>
// GitHub Pages lets browsers cache files for 10 minutes, and a reload doesn't refresh
// scripts. Load our own files with a fresh query so every reload runs the latest code
// (the large vendor libraries stay cached).
(function (v) {
  var map = { imports: {} };
  ['ar', 'config', 'models', 'viewer', 'ui', 'demo1', 'demo2'].forEach(function (f) {
    map.imports['./js/' + f + '.js'] = './js/' + f + '.js?v=' + v;
  });
  document.write('<script type="importmap">' + JSON.stringify(map) + '<\/script>'
    + '<script src="js/diagnostics.js?v=' + v + '"><\/script>');
})(Date.now());
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printable Marker Sheets</title>
<style>
  :root { --ink: #0f172a; --muted: #475569; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e2e8f0; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .toolbar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 12px 16px; background: #0f172a; color: #fff; }
  .toolbar a, .toolbar button { color: #fff; background: #334155; border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; text-decoration: none; cursor: pointer; }
  .toolbar button.primary { background: #2563eb; }
  .toolbar .hint { font-size: 14px; color: #cbd5e1; flex: 1 1 260px; }
  .pages { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; overflow-x: auto; }
  .page { position: relative; background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,.15); overflow: hidden; flex: none; }
  .page.landscape { width: 297mm; height: 210mm; }
  .page.portrait { width: 210mm; height: 297mm; }
  .marker { position: absolute; }
  .marker svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
  .id { position: absolute; font-size: 2.6mm; color: #94a3b8; }

  .work-area { position: absolute; left: 82mm; right: 82mm; top: 22mm; bottom: 22mm; border: 0.6mm dashed #94a3b8; border-radius: 4mm;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6mm; }
  .work-area h1 { margin: 0 0 3mm; font-size: 7mm; }
  .work-area p { margin: 0 0 2mm; font-size: 3.6mm; color: var(--muted); line-height: 1.35; }
  .footer { position: absolute; left: 0; right: 0; bottom: 5mm; text-align: center; font-size: 3mm; color: #94a3b8; }

  .corner-head { position: absolute; left: 20mm; right: 20mm; top: 12mm; height: 44mm; display: flex; align-items: center; justify-content: space-between; gap: 6mm; }
  .corner-head h1 { margin: 0; font-size: 13mm; line-height: 1; }
  .corner-head p { margin: 2mm 0 0; font-size: 4mm; color: var(--muted); }
  .corner-head svg { width: 46mm; flex: none; }
  .corner-foot { position: absolute; left: 20mm; right: 20mm; top: 240mm; text-align: center; font-size: 4.4mm; font-weight: 700; }
  .corner-foot .arrow { font-size: 14mm; line-height: 1; display: block; }
  .corner-foot p { margin: 1mm 0 0; font-weight: 400; font-size: 3.6mm; color: var(--muted); }
  .bracket { position: absolute; width: 16mm; height: 16mm; border: 0 solid #0f172a; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .pages { padding: 0; gap: 0; display: block; }
    .page { box-shadow: none; break-after: page; }
  }
</style>
<style id="page-size"></style>
</head>
<body>
<div class="toolbar">
  <button class="primary" onclick="print()">Print</button>
  <a href="?set=board">Demo 1: single sheet</a>
  <a href="?set=table">Demo 2: table corners</a>
  <a href="./">Back</a>
  <span class="hint">Print on DIN A4 at 100 % / "actual size", no "fit to page". Matte paper works best (less glare).</span>
</div>
<div class="pages" id="pages"></div>

<script src="vendor/aruco/cv.js"></script>
<script src="vendor/aruco/aruco.js"></script>
<script type="module">
import { DICTIONARY, BOARD, TABLE_CORNERS, CORNER_PAGE, CORNER_MARKER_SIZE } from './js/config.js';

const dict = new AR.Dictionary(DICTIONARY);
const mm = (m) => `${(m * 1000).toFixed(2)}mm`;

// generateSVG() includes a 1-cell white quiet zone; crop the viewBox to the black square.
function markerSVG(id) {
  const n = dict.markSize;
  return dict.generateSVG(id).replace(/viewBox="[^"]*"/, `viewBox="1 1 ${n} ${n}"`);
}

function marker(id, left, top, size) {
  const el = document.createElement('div');
  el.className = 'marker';
  Object.assign(el.style, { left: mm(left), top: mm(top), width: mm(size), height: mm(size) });
  el.innerHTML = markerSVG(id);
  return el;
}

function boardPage() {
  const { page, markerSize, markers } = BOARD;
  const el = document.createElement('section');
  el.className = 'page landscape';
  for (const m of markers) {
    const left = page.width / 2 + m.x - markerSize / 2;
    const top = page.height / 2 - m.y - markerSize / 2;
    el.append(marker(m.id, left, top, markerSize));
  }
  el.insertAdjacentHTML('beforeend', `
    <div class="work-area">
      <h1>AR Demo 1 · Model on A4</h1>
      <p>Lay this sheet flat on a table and point the phone at it.</p>
      <p>A complete building model appears standing on this sheet.</p>
      <p>One visible corner marker is enough to keep it in place.</p>
    </div>
    <div class="footer">Print at 100 % · ArUco ${DICTIONARY} · IDs ${markers.map((m) => m.id).join(', ')}</div>`);
  return el;
}

// Small table diagram with this sheet's corner highlighted.
function tableSVG(c) {
  const x = c.sx < 0 ? 4 : 56, y = c.sy < 0 ? 26 : 4;
  return `<svg viewBox="0 0 60 36"><rect x="2" y="2" width="56" height="26" rx="2" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="${x - 3}" y="${y - 2}" width="6" height="6" fill="#2563eb"/>
    <text x="30" y="34.5" font-size="5" text-anchor="middle" fill="#475569" font-family="system-ui">you stand here ↓</text></svg>`;
}

function cornerPage(c) {
  const el = document.createElement('section');
  el.className = 'page portrait';
  const left = (CORNER_PAGE.width - CORNER_MARKER_SIZE) / 2, top = (CORNER_PAGE.height - CORNER_MARKER_SIZE) / 2;
  el.append(marker(c.id, left, top, CORNER_MARKER_SIZE));
  // L-shaped bracket in the page corner that goes into the table corner.
  const side = c.sx < 0 ? 'left' : 'right', end = c.sy < 0 ? 'bottom' : 'top';
  el.insertAdjacentHTML('beforeend', `
    <div class="corner-head">
      <div><h1>${c.label}</h1><p>AR Demo 2 · table corner sheet</p></div>
      ${tableSVG(c)}
    </div>
    <div class="bracket" style="${side}:6mm;${end}:6mm;border-${side}-width:1.6mm;border-${end}-width:1.6mm"></div>
    <div class="corner-foot"><span class="arrow">↓</span>This edge faces you (front of the table)
      <p>Push the sheet into the ${c.label.toLowerCase()} corner of the table, so the bracket sits in the corner.</p></div>
    <div class="footer">Print at 100 % · ArUco ${DICTIONARY} · ID ${c.id}</div>`);
  return el;
}

const set = new URLSearchParams(location.search).get('set') || 'board';
const pages = document.getElementById('pages');
if (set === 'table') {
  document.getElementById('page-size').textContent = '@page { size: A4 portrait; margin: 0; }';
  TABLE_CORNERS.forEach((c) => pages.append(cornerPage(c)));
} else {
  document.getElementById('page-size').textContent = '@page { size: A4 landscape; margin: 0; }';
  pages.append(boardPage());
}
document.title = set === 'table' ? 'Demo 2 Table Corner Sheets' : 'Demo 1 Board Sheet';
document.body.dataset.ready = '1';
window.__appReady = true;
</script>
</body>
</html>
